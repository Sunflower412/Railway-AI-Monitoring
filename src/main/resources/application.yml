spring:
  application:
    name: railway-ai-monitoring

server:
  port: 9898

logging:
  level:
    com.railway.ai: DEBUG
    org.springframework.web: INFO

file:
  upload-dir: ./uploads
  image-dir: ./uploads/images
  video-dir: ./uploads/videos
  max-image-size: 10485760  # 10MB
  max-video-size: 104857600 # 100MB

report:
  storage-dir: ./data/reports

model:
  directory: ./models
  name: best.onnx
  class-names: person,train,railway,tree
  confidence-threshold: 0.25
  iou-threshold: 0.45
  max-detections: 50
  video-max-frames: 6
